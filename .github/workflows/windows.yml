name: Windows native build and real core
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned build-time SDK
        shell: pwsh
        run: python scripts/fetch_windows_sdk.py --cache-dir .deps/cache --sdk-dir .deps/rime
      - name: Build real TSF, broker and core
        shell: pwsh
        run: |
          $sdk = (Resolve-Path .deps/rime/dist).Path.Replace('\','/')
          cmake -S platforms/windows -B build/windows -G "Visual Studio 17 2022" -A x64 "-DRIME_INCLUDE_DIR=$sdk/include" "-DRIME_LIBRARY=$sdk/lib/rime.lib"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/windows --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item .deps/rime/dist/lib/rime.dll build/windows/Release
          Copy-Item .deps/rime/dist/lib/rime.dll build/windows/core/Release
      - name: Build and inspect 32-bit TSF client
        shell: pwsh
        run: |
          $sdk = (Resolve-Path .deps/rime/dist).Path.Replace('\','/')
          cmake -S platforms/windows -B build/windows-x86 -G "Visual Studio 17 2022" -A Win32 "-DRIME_INCLUDE_DIR=$sdk/include" "-DRIME_LIBRARY=$sdk/lib/rime.lib"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/windows-x86 --config Release --target YANVY-TSF YANVY-COM-Architecture-Fixture YANVY-Broker-Architecture-Fixture YANVY-Input-Mode-Fixture YANVY-TSF-Mode-Fixture YANVY-TSF-Identity-Fixture YANVY-Language-Bar-Fixture YANVY-Registration-Repair-Fixture YANVY-Package-Integrity-Fixture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & build/windows-x86/Release/YANVY-COM-Architecture-Fixture.exe (Resolve-Path build/windows-x86/Release/YANVY-TSF.dll).Path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & build/windows-x86/Release/YANVY-Input-Mode-Fixture.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & build/windows-x86/Release/YANVY-Language-Bar-Fixture.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & build/windows-x86/Release/YANVY-Registration-Repair-Fixture.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & build/windows-x86/Release/YANVY-Package-Integrity-Fixture.exe (Join-Path (Resolve-Path build/windows-x86).Path 'package-integrity-fixture')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & build/windows-x86/Release/YANVY-TSF-Mode-Fixture.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & build/windows-x86/Release/YANVY-TSF-Identity-Fixture.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Core privacy and editing regressions
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: python tests/test_core.py --binary build/windows/core/Release/ime-core.exe --report build/windows/core-results.json
      - name: Native input-mode button and repair integrity
        shell: pwsh
        run: |
          cmake --build build/windows --config Release --target YANVY-Language-Bar-Fixture YANVY-Registration-Repair-Fixture YANVY-Package-Integrity-Fixture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & build/windows/Release/YANVY-Language-Bar-Fixture.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & build/windows/Release/YANVY-Registration-Repair-Fixture.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & build/windows/Release/YANVY-Package-Integrity-Fixture.exe (Join-Path (Resolve-Path build/windows).Path 'package-integrity-fixture')
          exit $LASTEXITCODE
      - name: Render native candidate UI at three scales
        shell: pwsh
        run: |
          cmake --build build/windows --config Release --target YANVY-UI-Render YANVY-Installer-Preview YANVY-Preferences-Fixture YANVY-Registration-Fixture YANVY-Edit-Session-Fixture YANVY-Broker-Fixture YANVY-Tray-Event-Fixture YANVY-Input-Mode-Fixture YANVY-TSF-Mode-Fixture YANVY-COM-Registry-Fixture YANVY-Broker-Stop-Fixture YANVY-Machine-Store-Fixture YANVY-User-Cleanup-Fixture YANVY-Runtime-Environment-Fixture YANVY-Installer-Diagnostics-Fixture YANVY-TSF-Identity-Fixture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & build/windows/Release/YANVY-UI-Render.exe --check-layout
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & build/windows/Release/YANVY-Registration-Fixture.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & build/windows/Release/YANVY-Edit-Session-Fixture.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & build/windows/Release/YANVY-Tray-Event-Fixture.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & build/windows/Release/YANVY-Input-Mode-Fixture.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & build/windows/Release/YANVY-TSF-Mode-Fixture.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & build/windows/Release/YANVY-COM-Registry-Fixture.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & build/windows/Release/YANVY-Machine-Store-Fixture.exe (Join-Path (Resolve-Path build/windows).Path 'machine-store-fixture')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & build/windows/Release/YANVY-User-Cleanup-Fixture.exe (Join-Path (Resolve-Path build/windows).Path 'user-cleanup-fixture')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & build/windows/Release/YANVY-Runtime-Environment-Fixture.exe (Join-Path (Resolve-Path build/windows).Path 'runtime-fixture')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & build/windows/Release/YANVY-Installer-Diagnostics-Fixture.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & build/windows/Release/YANVY-TSF-Identity-Fixture.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & build/windows/Release/YANVY-Broker-Stop-Fixture.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & build/windows/Release/YANVY-Broker-Stop-Fixture.exe --upgrade (Join-Path (Resolve-Path build/windows).Path 'broker-upgrade-fixture')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($dpi in 96,144,192) {
            & build/windows/Release/YANVY-UI-Render.exe "build/windows/candidates-$dpi.png" $dpi
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            foreach ($page in 0,1,2,3,4) {
              $preview = Start-Process build/windows/Release/YANVY-Installer-Preview.exe -ArgumentList '--render-preview',"build/windows/setup-$dpi-$page.png",$dpi,$page -WindowStyle Hidden -Wait -PassThru
              if ($preview.ExitCode -ne 0) { exit $preview.ExitCode }
            }
          }
          python tests/test_installer_paths.py --binary build/windows/Release/YANVY-Installer-Preview.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & build/windows/Release/YANVY-Preferences-Fixture.exe build/windows/preferences-fixture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: COM ABI and broker isolation
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          & build/windows/Release/YANVY-Setup.exe --com-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/stage_data.py --shared-dir build/windows/Release/data --user-dir build/windows/Release/profile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $userProfile = (Join-Path (Resolve-Path build/windows).Path 'broker-user-profile')
          $testNamespace = [guid]::NewGuid().ToString('N')
          $server = Start-Process build/windows/Release/YANVY-Broker-Fixture.exe -ArgumentList '--serve-test',('"' + $userProfile + '"'),$testNamespace -WindowStyle Hidden -PassThru
          try {
            Start-Sleep -Seconds 5
            python tests/test_windows_broker.py --root build/windows/Release --profile-dir $userProfile --report build/windows/broker-results.json --namespace $testNamespace
            $result = $LASTEXITCODE
          } finally {
            & build/windows/Release/YANVY-Broker-Fixture.exe --stop-test $testNamespace
            $server.WaitForExit(5000) | Out-Null
          }
          if ($result -ne 0) { exit $result }
          python tests/test_runtime_profile.py --root build/windows/Release --profile build/windows/tampered-user-profile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test_legacy_bridge_conflict.py --root build/windows/Release --temp-dir build/windows --client-x86 build/windows-x86/Release/YANVY-Broker-Architecture-Fixture.exe
          exit $LASTEXITCODE
